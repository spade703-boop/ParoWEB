services:
  paro-web:
    build:
      context: .
    image: paro-web:local
    container_name: paro-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PARO_ENV: production
      PARO_COOKIE_SECURE: "true"
      PARO_DATABASE_PATH: /data/paro_web.sqlite3
      # Bot 的数据布局：JSON 在 data/paro/，头像仍在 data/images/。
      # 写成 ${VAR:-default} 是为了让 .env 里也能覆盖，否则 compose 的 environment 会压过 env_file。
      PARO_CONTENT_DIR: ${PARO_CONTENT_DIR:-/bot-data/paro}
      PARO_IMAGES_DIR: ${PARO_IMAGES_DIR:-/bot-data/images}
      PARO_ANNOUNCEMENTS_PATH: /data/announcements.json
      PARO_MYSEKAI_SERVICE_URL: http://mysekai-parser:8765
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./content:/app/content:ro
      - ${PARO_BOT_DATA_DIR:-/akito_bot/data}:/bot-data:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      - mysekai-parser

  mysekai-parser:
    build:
      context: ${PARO_MYSEKAI_PIPELINE_DIR:-../mysekai-re-pipeline}
      dockerfile_inline: |
        FROM python:3.12-slim
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
        WORKDIR /app
        COPY requirements.txt ./
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        CMD ["python", "service/server.py"]
    image: mysekai-re-pipeline:local
    container_name: mysekai-parser
    restart: unless-stopped
    environment:
      MYSEKAI_HOST: 0.0.0.0
      MYSEKAI_PORT: "8765"
      MYSEKAI_REGION: sc
      # 群指令「更新国服MD / 更新日服MD」的共享口令；未配置时接口关闭。
      MYSEKAI_ADMIN_TOKEN: ${PARO_MYSEKAI_INTERNAL_TOKEN}
      # 运行时的 master 数据目录；镜像里的 master/ 只作首次启动的 seed。
      MYSEKAI_MASTER_DIR: /app/data/master
    volumes:
      # seed：只读，镜像自带的快照。
      - ${PARO_MYSEKAI_PIPELINE_DIR:-../mysekai-re-pipeline}/master:/app/master:ro
      # 静态资产同理挂载：不进镜像，补图后重启即可，重建也快得多。
      - ${PARO_MYSEKAI_PIPELINE_DIR:-../mysekai-re-pipeline}/assets:/app/assets:ro
      # 运行时数据：宿主机持久化，更新后无需 commit 或重建容器。
      - ${PARO_MYSEKAI_DATA_DIR:-/opt/mysekai-data}/master:/app/data/master
    expose:
      - "8765"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
