services:
  paro-web:
    build:
      context: .
    image: paro-web:local
    container_name: paro-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PARO_ENV: production
      PARO_COOKIE_SECURE: "true"
      PARO_DATABASE_PATH: /data/paro_web.sqlite3
      # Bot 的数据布局：JSON 在 data/paro/，头像仍在 data/images/。
      # 写成 ${VAR:-default} 是为了让 .env 里也能覆盖，否则 compose 的 environment 会压过 env_file。
      PARO_CONTENT_DIR: ${PARO_CONTENT_DIR:-/bot-data/paro}
      PARO_IMAGES_DIR: ${PARO_IMAGES_DIR:-/bot-data/images}
      PARO_ANNOUNCEMENTS_PATH: /data/announcements.json
      PARO_MYSEKAI_SERVICE_URL: http://mysekai-parser:8765
      # pjsk-intel 长图落在持久化数据盘（容器根文件系统只读）。
      PARO_PJSK_INTEL_IMAGE_DIR: /data/pjsk-intel-images
      # worker 通过 compose 服务名访问本服务（Host: paro-web），必须放行；
      # 保留 .env 里已有的公网域名白名单。
      PARO_ALLOWED_HOSTS: ${PARO_ALLOWED_HOSTS:-localhost,127.0.0.1},paro-web
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./content:/app/content:ro
      - ${PARO_BOT_DATA_DIR:-/akito_bot/data}:/bot-data:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      - mysekai-parser

  # 国服 Master 更新雷达（PJSK_INTEL_WORK_PLAN.md §15）：自动轮询、渲染、入库；
  # 推送由 ParoWEB 发布队列 → AkitoBot 完成，worker 本身不映射端口。
  pjsk-intel-worker:
    image: mysekai-re-pipeline:local
    container_name: pjsk-intel-worker
    restart: unless-stopped
    # 复用 mysekai-parser 构建出的同一个镜像，必须先有它。
    depends_on:
      - mysekai-parser
    command:
      - python
      - -m
      - intel.worker
      - --region
      - sc
      - --interval
      - "60"
    environment:
      PJSK_INTEL_ROOT: /app/data
      PJSK_INTEL_PARO_BASE: http://paro-web:8000
      PJSK_INTEL_INGEST_TOKEN: ${PARO_PJSK_INTEL_INGEST_TOKEN}
      # 影子模式开关：没显式传就默认 0（正式推送）。首次上线建议 .env 里设 1。
      PJSK_INTEL_SHADOW: ${PJSK_INTEL_SHADOW:-0}
      MYSEKAI_GITHUB_MIRRORS: ${MYSEKAI_GITHUB_MIRRORS:-}
    volumes:
      - /data/pjsk-intel:/app/data
    healthcheck:
      test: ["CMD", "python", "-m", "intel.healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  mysekai-parser:
    build:
      context: ${PARO_MYSEKAI_PIPELINE_DIR:-../mysekai-re-pipeline}
      # 解析服务与 pjsk-intel-worker 共用同一个镜像（工作计划 §15）。
      dockerfile: Dockerfile
    image: mysekai-re-pipeline:local
    container_name: mysekai-parser
    restart: unless-stopped
    environment:
      MYSEKAI_HOST: 0.0.0.0
      MYSEKAI_PORT: "8765"
      MYSEKAI_REGION: sc
      # 群指令「更新国服MD / 更新日服MD」的共享口令；未配置时接口关闭。
      MYSEKAI_ADMIN_TOKEN: ${PARO_MYSEKAI_INTERNAL_TOKEN}
      # 运行时的 master 数据目录；镜像里的 master/ 只作首次启动的 seed。
      MYSEKAI_MASTER_DIR: /app/data/master
      # 运行时的资源目录：「更新国服MD」把新图标写在这里（镜像 assets 是只读 seed）。
      MYSEKAI_ASSETS_DIR: /app/data/assets
      # 国服客户端版本探测的起点；有更新版本时自动向上找。
      MYSEKAI_CN_APP_VERSION: "6.4.0"
    volumes:
      # seed：只读，镜像自带的快照。
      - ${PARO_MYSEKAI_PIPELINE_DIR:-../mysekai-re-pipeline}/master:/app/master:ro
      # 静态资产同理挂载：不进镜像，补图后重启即可，重建也快得多。
      - ${PARO_MYSEKAI_PIPELINE_DIR:-../mysekai-re-pipeline}/assets:/app/assets:ro
      # 运行时数据：宿主机持久化，更新后无需 commit 或重建容器。
      - ${PARO_MYSEKAI_DATA_DIR:-/opt/mysekai-data}/master:/app/data/master
      - ${PARO_MYSEKAI_DATA_DIR:-/opt/mysekai-data}/assets:/app/data/assets
    expose:
      - "8765"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    # 全量同步要解析 23MB 清单 + 8.4MB 资源包，留出余量。
    mem_limit: 1.5g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
