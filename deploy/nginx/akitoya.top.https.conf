server {
    listen 80;
    listen [::]:80;
    server_name akitoya.top www.akitoya.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location / {
        return 301 https://akitoya.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.akitoya.top;

    ssl_certificate /etc/letsencrypt/live/akitoya.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akitoya.top/privkey.pem;

    return 301 https://akitoya.top$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name akitoya.top;

    ssl_certificate /etc/letsencrypt/live/akitoya.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akitoya.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /internal/ {
        return 404;
    }

    location = /api/v1/mysekai/submit {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 8m;
    }

    # 移动端抓包模块上报原始响应体（实测 165～325 KB，留足余量）。
    location = /api/v1/mysekai/ingest {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 8m;
    }

    # 目录卡（唱片/家具/对话）是整张 PNG，首次渲染要逐一贴封面，60s 不够。
    location ^~ /api/v1/mysekai/catalog/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }
}
