server {
    listen 80;
    listen [::]:80;
    server_name akitoya.top www.akitoya.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://akitoya.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.akitoya.top;

    ssl_certificate /etc/letsencrypt/live/akitoya.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akitoya.top/privkey.pem;

    return 301 https://akitoya.top$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name akitoya.top;

    ssl_certificate /etc/letsencrypt/live/akitoya.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akitoya.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }
}
